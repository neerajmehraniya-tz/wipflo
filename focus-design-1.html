<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus – Design 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0050ff; --primary-dark:#002b8a; --primary-hover:#0034a3;
  --blue-50:#edf5fc; --blue-100:#dae9f7; --ws-bg:#eaf1ff; --ws-text:#3360b4;
  --text:#181919; --text-2:#63666a; --text-3:#a9b0b8;
  --border:#e6e8eb; --border-strong:#a9b0b8;
  --surface:#ffffff; --surface-2:#f8fafc; --ink:#242933;
  --row-hover:#fafbfd; --row-selected:#eef4ff;
  --setup:#f2a900; --setup-bar:#ffb703; --notstarted:#8e97a6; --notstarted-bar:#a9b0b8;
  --working:#0fa5e9; --working-bar:#00bdff; --hold:#f0481a; --hold-bar:#ff5017; --complete:#009966;
  --shadow-sm:0 1px 2px rgba(24,25,25,.06),0 1px 3px rgba(24,25,25,.08);
  --shadow-md:0 4px 12px rgba(24,25,25,.10),0 2px 4px rgba(24,25,25,.06);
  --shadow-lg:0 12px 32px rgba(24,25,25,.16),0 4px 8px rgba(24,25,25,.08);
  --nav-w:280px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--surface);font-size:12px;line-height:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;display:block}
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Navigation ---------- */
.nav{width:var(--nav-w);flex:none;display:flex;flex-direction:column;height:100vh}
.nav-logo svg{display:block}
.nav-items{display:flex;flex-direction:column}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;color:var(--text-2);font-weight:600}
.nav-item svg{color:var(--text-2)}
.nav-item:hover{color:var(--text)}
.nav-item:hover svg{color:var(--text)}
.nav-item.active{color:var(--text)}
.nav-item.active svg{color:var(--primary)}
.v2 .nav-item.active svg,.v3 .nav-item.active svg{color:var(--text)}
.nav-item .lbl{flex:1}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:24px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--text);background:var(--surface)}
.count.warn{background:#fef9d9;border-color:#ffb703;color:#a36f00}
.nav-foot{margin-top:auto}
.help{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:8px;padding:12px;text-align:center;color:var(--text-2);font-weight:500}
.help svg{width:32px;height:32px;color:var(--primary);margin:0 auto 8px}
.link{color:var(--primary);font-weight:600}
.link:hover{color:var(--primary-hover);text-decoration:underline}
.user{display:flex;align-items:center;gap:8px;margin-top:16px}
.avatar-lg{width:40px;height:40px;border-radius:50%;background:var(--blue-50);color:#0078a3;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.user .who{flex:1;min-width:0}
.user .who b{display:block;font-size:14px;line-height:18px;font-weight:600}
.user .who span{color:var(--text-2);font-weight:500}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-2)}
.icon-btn:hover{border-color:var(--blue-100);background:var(--blue-50);color:var(--primary)}

/* V1 nav */
.v1 .nav{padding:8px}
.v1 .nav-wrap{flex:1;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.v1 .nav-logo{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface);border-bottom:1px solid var(--border);height:66px}
.v1 .nav-logo .icon-btn{width:24px;height:24px;border-radius:6px}
.v1 .nav-items{padding:16px;gap:8px}
.v1 .nav-item{height:42px;padding:0 12px;border-radius:12px;font-size:14px;line-height:18px;border:1px solid transparent}
.v1 .nav-item:hover{background:var(--surface)}
.v1 .nav-item.active{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow-sm)}
.v1 .nav-foot{padding:0}
.v1 .nav-foot .help{margin:0 16px 16px}
.v1 .nav-foot .user{margin:0;padding:16px;background:var(--surface);border-top:1px solid var(--border)}

/* V2 / V3 nav */
.v2 .nav,.v3 .nav{padding:16px;border-right:1px solid var(--border)}
.v2 .nav{background:var(--surface-2)}
.v3 .nav{background:var(--surface)}
.v2 .nav-logo,.v3 .nav-logo{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:16px}
.v3 .nav-logo .icon-btn{border-color:transparent}
.ws-btn{display:flex;align-items:center;gap:8px;width:100%;height:48px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;line-height:18px;font-weight:600;text-align:left}
.ws-btn:hover{border-color:var(--blue-100)}
.ws-btn[aria-expanded="true"]{border-color:var(--primary)}
.ws-btn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-ini{width:24px;height:24px;border-radius:4px;background:var(--ws-bg);color:var(--ws-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.v2 .nav-items,.v3 .nav-items{margin-top:16px;gap:4px}
.v2 .nav-item,.v3 .nav-item{height:32px;padding:0 8px;border-radius:8px;font-size:12px;border:1px solid transparent}
.v2 .nav-item:hover{background:var(--surface)}
.v2 .nav-item.active{background:var(--surface);border-color:var(--border)}
.v3 .nav-item:hover{background:var(--surface-2)}
.v3 .nav-item.active{background:var(--blue-50)}
.nav-group{font-size:10px;line-height:12px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.02em;margin:12px 0 4px}
.nav-group:first-child{margin-top:0}
.v2 .nav-foot,.v3 .nav-foot{padding-top:16px}
.v3 .user .icon-btn{border-color:transparent}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}
.page-head{display:flex;align-items:center;gap:12px}
.v1 .page-head{padding:24px 24px 16px}
.v2 .page-head,.v3 .page-head{padding:16px 16px 16px}
.page-title{margin:0;font-weight:600}
.v1 .page-title{font-size:20px;line-height:28px}
.v2 .page-title,.v3 .page-title{font-size:24px;line-height:32px}
.binary{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;height:34px}
.binary button{padding:0 12px;font-size:14px;line-height:18px;font-weight:500;color:var(--text-2);border:1px solid transparent}
.binary button[aria-pressed="true"]{background:var(--blue-50);border-color:var(--blue-100);color:var(--primary);border-radius:7px}
.binary button:not([aria-pressed="true"]):hover{color:var(--text)}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:12px}
.btn{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-2);font-size:14px;line-height:18px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--blue-100);background:var(--blue-50);color:var(--primary)}
.btn[aria-expanded="true"]{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.primary:disabled{background:var(--blue-100);border-color:var(--blue-100);color:#fff;cursor:not-allowed}
.btn.accent{color:var(--primary)}
.btn .badge{background:var(--primary);color:#fff;border-radius:10px;min-width:18px;height:18px;padding:0 5px;font-size:11px;line-height:18px;text-align:center}
.search{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);width:264px;color:var(--text-2)}
.search:focus-within{border-color:var(--primary)}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:14px;line-height:18px;font-weight:500;background:transparent}
.search input::placeholder{color:var(--text-2)}
.search .clr{display:none;color:var(--text-2)}
.search.has .clr{display:block}
.v1 .search{width:auto;cursor:pointer;transition:width .18s ease}
.v1 .search input{width:52px;cursor:pointer;font-weight:600}
.v1 .search:hover{background:var(--blue-50);border-color:var(--blue-100)}
.v1 .search.open{width:264px;cursor:text;background:var(--surface)}
.v1 .search.open input{width:auto;cursor:text;font-weight:500}

.view-select{height:34px;width:184px;display:flex;align-items:center;gap:8px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-2);font-weight:500;font-size:12px;line-height:14px;text-align:left}
.view-select:hover{border-color:var(--blue-100)}
.view-select[aria-expanded="true"]{border-color:var(--primary)}
.view-select .vs-l{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.view-select.has .vs-l{color:var(--text);font-weight:600}
.view-select .vs-x{display:none;border-radius:4px;color:var(--text-2)}
.view-select.has .vs-x{display:block}
.view-select .vs-x:hover{color:var(--text);background:var(--surface-2)}

/* Quick filters */
.quick{display:flex;align-items:center;flex-wrap:wrap}
.v1 .quick{padding:0 24px 16px;gap:4px}
.v2 .quick{padding:0 16px 16px;gap:8px}
.quick .ttl{margin-right:4px}
.v1 .quick .ttl{font-weight:600;color:var(--text)}
.v2 .quick .ttl{font-weight:500;color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500;font-size:12px;line-height:16px;transition:background .12s,border-color .12s,color .12s}
.v1 .chip{height:32px;padding:0 8px;border-radius:4px;background:transparent;color:var(--text);border:1px solid transparent}
.v1 .chip:hover{color:var(--primary-hover);background:var(--blue-50)}
.v1 .chip[aria-pressed="true"]{border-color:var(--primary-dark);color:var(--primary-dark);background:var(--blue-50)}
.v1 .chip .x{display:none;width:16px;height:16px;margin-right:-4px;border-radius:3px;align-items:center;justify-content:center}
.v1 .chip .x svg{width:12px;height:12px}
.v1 .chip[aria-pressed="true"] .x{display:inline-flex}
.v1 .chip .x:hover{background:var(--blue-100)}
.v2 .chip{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--surface)}
.v2 .chip:hover{border-color:var(--border-strong);color:var(--text)}
.v2 .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f8fbff}
.v2 .chip[aria-pressed="true"]:hover{background:#000;border-color:#000}
.chip.more{font-weight:500}
.v2 .chip.more{border-style:dashed}

/* Status filter – pills (V2, V3) */
.status-pills{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 16px}
.pill{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;line-height:18px;font-weight:500;color:var(--text-2)}
.pill .dot{width:8px;height:8px;border-radius:4px}
.pill b{font-size:12px;font-weight:700;color:var(--text)}
.pill:hover:not(:disabled){border-color:var(--border-strong);color:var(--text)}
.pill[aria-pressed="true"]{background:var(--blue-100);border-color:var(--primary);color:var(--text);font-weight:600}
.pill:disabled{color:var(--text-3);cursor:not-allowed}
.pill:disabled b{color:var(--text-3)}
.pill:disabled .dot{opacity:.55}

/* Status filter – tab strip (V1) */
.status-tabs{margin:0 24px 16px;display:flex;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
.stab{flex:1;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;line-height:18px;font-weight:600;color:var(--text-2);border:1px solid transparent}
.stab:hover:not(:disabled):not([aria-pressed="true"]){color:var(--text);background:rgba(255,255,255,.55)}
.stab[aria-pressed="true"]{background:var(--surface);border-color:#fff;color:var(--text);box-shadow:var(--shadow-sm)}
.stab .cnt{min-width:24px;height:24px;padding:0 7px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#f8fafc}
.stab:disabled{color:var(--text-3);cursor:not-allowed}
.stab:disabled .cnt{opacity:.45}

/* ---------- Table ---------- */
.table-area{flex:1;min-height:0;display:flex;flex-direction:column}
.v1 .table-area{padding:0 24px 24px}
.v2 .table-area,.v3 .table-area{padding:0 16px 16px}
.table-scroll{overflow:auto;border:1px solid var(--border);border-radius:4px;max-height:100%;position:relative;align-self:flex-start;max-width:100%}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;padding:0 8px;overflow:hidden}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid tbody tr:last-child td{border-bottom:0}
.grid th{height:40px;background:var(--surface-2);font-weight:600;position:sticky;top:0;z-index:2;user-select:none;overflow:visible}
.grid td{height:48px;font-weight:500;background:var(--surface)}
.grid td.cb,.grid th.cb{padding:0;text-align:center}
.grid td.ic,.grid th.ic{padding:0;text-align:center}
.grid tbody tr:hover td{background:var(--row-hover)}
.grid tbody tr:hover td.c-name{color:var(--primary)}
.grid tbody tr.sel td{background:var(--row-selected)}
.grid tbody tr.sel:hover td{background:var(--row-selected)}
.cell-txt{display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th-in{display:flex;align-items:center;gap:4px;height:40px;cursor:pointer;min-width:0}
.th-in .lb{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sort-ic{width:16px;height:16px;flex:none;color:var(--text-2)}
.sort-ic.on{color:var(--primary)}
.v2 .sort-ic.off,.v3 .sort-ic.off{opacity:0;transition:opacity .12s}
.v2 th:hover .sort-ic.off,.v3 th:hover .sort-ic.off{opacity:.45}
.rz{position:absolute;top:0;right:-5px;width:9px;height:100%;cursor:col-resize;z-index:3;display:flex;justify-content:center}
.rz::after{content:"";width:2px;height:100%;background:transparent;transition:background .1s}
.rz:hover::after,.rz.drag::after{background:var(--primary)}
.guide{position:absolute;top:0;width:2px;background:var(--primary);z-index:4;pointer-events:none;display:none}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}

/* checkbox */
.ck{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;cursor:pointer;position:relative}
.ck input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ck .bx{width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .1s,border-color .1s}
.ck .bx svg{width:12px;height:12px;display:none}
.ck:hover .bx{border-color:var(--primary)}
.ck input:checked+.bx{background:var(--primary);border-color:var(--primary)}
.ck input:checked+.bx .on{display:block}
.ck input:indeterminate+.bx{background:var(--primary);border-color:var(--primary)}
.ck input:indeterminate+.bx .ind{display:block}
.ck input:focus-visible+.bx{outline:2px solid var(--primary);outline-offset:2px}

/* cells */
.wp{width:120px}
.wp-top{display:flex;align-items:center;gap:4px;line-height:14px}
.wp-top .dot{width:6px;height:6px;border-radius:3px}
.wp-top .st{flex:1}
.wp-bar{margin-top:4px;height:6px;border:1px solid;border-radius:4px;background:#fff;overflow:hidden}
.wp-bar i{display:block;height:100%}
.prio{display:flex;align-items:center;gap:4px}
.prio svg{width:16px;height:16px}
.person{display:flex;align-items:center;gap:4px;min-width:0}
.av{width:20px;height:20px;border-radius:50%;background:var(--blue-50);color:#0078a3;font-size:9px;line-height:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.person span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-ic{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.row-ic svg{width:14px;height:14px}
.row-ic.pub{background:var(--blue-50);color:var(--primary)}
.row-ic.hold{background:#fdece6;color:var(--hold)}
.empty td{height:200px;text-align:center;background:#fff!important}
.empty p{margin:0 0 12px;font-size:14px;line-height:18px;font-weight:600;color:var(--text)}
.empty span{display:block;color:var(--text-2);margin-bottom:16px}

/* ---------- Bulk action strip ---------- */
.bulk{position:absolute;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:12px;padding:6px 6px 6px 16px;box-shadow:var(--shadow-lg);transition:transform .2s ease,opacity .2s ease;z-index:20;white-space:nowrap}
.bulk.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.bulk .n{font-size:14px;line-height:18px;font-weight:600;margin-right:8px}
.bulk .sep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 6px}
.bulk .ba{height:34px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:8px;font-size:14px;line-height:18px;font-weight:600;color:#f8fbff;border:1px solid rgba(255,255,255,.35)}
.bulk .ba:hover{background:rgba(255,255,255,.08);border-color:#fff}
.bulk .ba + .ba{margin-left:4px}
.bulk .ba.x{width:34px;padding:0;justify-content:center;color:#c5cbd3;border-color:transparent}
.bulk .ba.x:hover{color:#fff}
.bulk :focus-visible{outline-color:#8fb3ff}

/* ---------- Toast ---------- */
.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:18px;font-weight:500;transition:transform .2s,opacity .2s;z-index:21;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ok{color:var(--complete)}
.toast button{color:var(--primary);font-weight:600}
.toast button:hover{text-decoration:underline}
.toast.low{bottom:24px}

/* ---------- Menus / popovers ---------- */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);padding:6px;min-width:200px;display:none}
.pop.show{display:block}
.mi{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 8px;border-radius:6px;text-align:left;font-size:13px;line-height:18px;font-weight:500;color:var(--text)}
.mi:hover,.mi:focus-visible{background:var(--blue-50);outline:0}
.mi .tick{margin-left:auto;color:var(--primary);visibility:hidden}
.mi[aria-checked="true"] .tick{visibility:visible}
.mi[aria-checked="true"]{font-weight:600}
.mi.add{color:var(--primary);font-weight:600}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.pop h4{margin:6px 8px;font-size:11px;line-height:14px;font-weight:600;color:var(--text-2)}
.fgroup{padding:2px 0 6px}
.fopt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;line-height:18px;font-weight:500;cursor:pointer}
.fopt:hover{background:var(--surface-2)}
.pop-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;border-top:1px solid var(--border);margin-top:4px}
.save-pop{width:300px;padding:16px}
.save-pop h3{margin:0 0 4px;font-size:14px;line-height:18px;font-weight:600}
.save-pop p{margin:0 0 12px;color:var(--text-2);font-weight:500}
.field{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-weight:500;outline:0}
.field:focus{border-color:var(--primary)}
.field.err{border-color:var(--hold)}

/* ---------------- Filtering ---------------- */
function quickPredicate(){
  if (V==='v3'){ const v=S.views.find(x=>x.id===S.view); return v&&v.quick ? QUICK[v.quick] : null; }
  return S.quick ? QUICK[S.quick] : null;
}
function baseRows(){ // everything except status
  const q = quickPredicate(), f=S.filters, s=S.search.trim().toLowerCase();
  return rows.filter(r =>
    (!q || q(r)) &&
    (!f.priority.size || f.priority.has(r.priority)) &&
    (!f.dept.size || f.dept.has(r.dept)) &&
    (!f.mgr.size || f.mgr.has(r.mgr)) &&
    (!s || r.name.toLowerCase().includes(s) || r.client.toLowerCase().includes(s))
  );
}
function visibleRows(){
  let list = baseRows().filter(r => S.statuses.size ? S.statuses.has(r.status) : r.status!=='complete');
  const {key,dir} = S.sort, m = dir==='asc'?1:-1;
  const val = r => key==='status' ? SMAP[r.status].order*1000 + r.pct : key==='priority' ? PRIO[r.priority].o : String(r[key]);
  return list.sort((a,b)=>{ const x=val(a), y=val(b); const c = typeof x==='number' ? x-y : x.localeCompare(y, undefined, {numeric:true, sensitivity:'base'}); return c*m || a.id-b.id; });
}
function counts(){
  const b = baseRows(); const c = {all: b.filter(r=>r.status!=='complete').length};
  STATUSES.forEach(s=> c[s.key] = b.filter(r=>r.status===s.key).length);
  return c;
}

    sIn.addEventListener('blur', ()=>{ if(!sIn.value) sBox.classList.remove('open'); });
  }
  sIn.addEventListener('input', ()=>{ S.search = sIn.value; sBox.classList.toggle('has', !!sIn.value); renderBody(); });
  sIn.addEventListener('keydown', e=>{ if(e.key==='Escape'){ sIn.value=''; S.search=''; sBox.classList.remove('has'); renderBody(); }});
  $('#searchClr').addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); sIn.value=''; S.search=''; sBox.classList.remove('has'); renderBody(); sIn.focus(); });
  $('#filtersBtn').onclick = e => openFilters(e.currentTarget);
  $('#customizeBtn').onclick = () => toast('Customize columns isn’t part of this prototype');
  $('.binary').querySelectorAll('button')[1].onclick = () => toast('Work Item view isn’t part of this prototype');
  if (V==='v3'){
    const vs = $('#viewSel');
    vs.onclick = e => { if (e.target.closest('#viewClr')) return; openViewMenu(vs); };
    vs.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openViewMenu(vs);} };
    const clr = $('#viewClr');
    const clear = e => { e.stopPropagation(); applyView(null); };
    clr.onclick = clear; clr.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clear(e);} };
    $('#saveViewBtn').onclick = e => openSaveView(e.currentTarget);
    updateSaveView();
  }
}
function updateFilterBadge(){
  const b = $('#filtersBtn'); if(!b) return; const n = activeFilterCount();
  const exp = b.getAttribute('aria-expanded');
  b.innerHTML = `${ic('funnel')}Filters${n?`<span class="badge">${n}</span>`:''}`; b.setAttribute('aria-expanded',exp);
}

/* ---------------- Quick filters (V1, V2) ---------------- */
function renderQuick(){
  if (V==='v3'){ $('#quickWrap').innerHTML=''; return; }
  let list = QUICK_ORDER.slice();
  let shown = list;
  const hidden = list.length - VISIBLE_QUICK;
  if (!S.quickOpen && hidden>0){
    shown = list.slice(0, VISIBLE_QUICK);
    if (S.quick && !shown.includes(S.quick)) shown = [...list.slice(0, VISIBLE_QUICK-1), S.quick]; // keep active filter visible
  }
  const chip = n => `<button class="chip" aria-pressed="${S.quick===n}" data-q="${esc(n)}">${esc(n)}${V==='v1'?`<span class="x" data-qx="1" aria-label="Remove ${esc(n)} filter" role="button">${ic('x')}</span>`:''}</button>`;
  let more = '';
  if (hidden>0){
    const label = S.quickOpen ? 'Show less' : (V==='v1' ? '...Show more' : `+${list.length - shown.length} more`);
    more = `<button class="chip more" id="quickMore" aria-expanded="${S.quickOpen}">${label}</button>`;
  }
  $('#quickWrap').innerHTML = `<div class="quick" role="group" aria-label="Quick filters"><span class="ttl">Quick Filters:</span>${shown.map(chip).join('')}${more}</div>`;
  $('#quickWrap').querySelectorAll('.chip[data-q]').forEach(b => b.onclick = e => {
    const n = b.dataset.q;
    if (e.target.closest('[data-qx]') || S.quick===n) S.quick = null; else S.quick = n;
    renderQuick(); renderStatus(); renderBody();
  });
  const m = $('#quickMore'); if (m) m.onclick = () => { S.quickOpen = !S.quickOpen; renderQuick(); };
}

/* ---------------- Status filter ---------------- */
function toggleStatus(key){
  if (key==='all') S.statuses.clear();
  else if (S.statuses.has(key)) S.statuses.delete(key);
  else S.statuses.add(key);
  renderStatus(); renderBody(); if (V==='v3') updateSaveView();
}
function renderStatus(){
  const c = counts();
  const allOn = S.statuses.size===0;
  let html;
  if (V==='v1'){
    const tab = (key,label,n,color,tc,on) => `<button class="stab" data-s="${key}" aria-pressed="${on}" ${!n&&key!=='all'&&!on?'disabled':''}>${label}<span class="cnt" style="background:${color};color:${tc}">${n}</span></button>`;
    html = `<div class="status-tabs" role="group" aria-label="Filter by status">${tab('all','All',c.all,'#0050ff','#fff',allOn)}${STATUSES.map(s=>tab(s.key,s.label,c[s.key],s.tab,s.tabText,S.statuses.has(s.key))).join('')}</div>`;
  } else {
    const pill = (key,label,n,dot,on) => `<button class="pill" data-s="${key}" aria-pressed="${on}" ${!n&&key!=='all'&&!on?'disabled':''}>${dot?`<span class="dot" style="background:${dot}"></span>`:''}${label} <b>${n}</b></button>`;
    html = `<div class="status-pills" role="group" aria-label="Filter by status">${pill('all','All',c.all,null,allOn)}${STATUSES.map(s=>pill(s.key,s.label,c[s.key],s.dot,S.statuses.has(s.key))).join('')}</div>`;
  }
  $('#statusWrap').innerHTML = html;
  $('#statusWrap').querySelectorAll('[data-s]').forEach(b => b.onclick = () => toggleStatus(b.dataset.s));
}

/* ---------------- Table ---------------- */
function initWidths(){
  const avail = $('#scroll').parentElement.clientWidth - 2 - CB_W - (HAS_ICON_COL?IC_W:0);
  const w = Math.max(MIN_W, Math.floor(avail / COLS.length));
  S.widths = Object.fromEntries(COLS.map(c=>[c.key,w]));
  const used = w*COLS.length; if (used < avail) S.widths.mgr += avail-used;
}
function applyWidths(){
  const total = CB_W + (HAS_ICON_COL?IC_W:0) + COLS.reduce((a,c)=>a+S.widths[c.key],0);
  $('#grid').style.width = total+'px';
  $('#cols').innerHTML = `<col style="width:${CB_W}px">${HAS_ICON_COL?`<col style="width:${IC_W}px">`:''}${COLS.map(c=>`<col data-k="${c.key}" style="width:${S.widths[c.key]}px">`).join('')}`;
}
function sortIcon(key){
  const on = S.sort.key===key;
  if (on) return `<span class="sort-ic on" title="${S.sort.dir==='asc'?'Sorted ascending':'Sorted descending'}">${ic(S.sort.dir==='asc'?'arrowDownB':'arrowUpB')}</span>`;
  if (V==='v1') return `<span class="sort-ic">${ic('arrowsDU')}</span>`;
  return `<span class="sort-ic off">${ic('arrowDownB')}</span>`; // faded preview: next click sorts ascending
}
function renderHeadRow(){
  const vis = visibleRows(); const selVis = vis.filter(r=>S.selected.has(r.id)).length;
  const ck = `<label class="ck" title="Select all"><input type="checkbox" id="ckAll" aria-label="Select all rows" ${vis.length&&selVis===vis.length?'checked':''} ${vis.length?'':'disabled'}><span class="bx">${ic('checkB','on')}${ic('minusB','ind')}</span></label>`;
  $('#thead').innerHTML = `<tr><th class="cb">${ck}</th>${HAS_ICON_COL?'<th class="ic" aria-label="Indicators"></th>':''}${COLS.map(c=>`<th data-k="${c.key}" aria-sort="${S.sort.key===c.key?(S.sort.dir==='asc'?'ascending':'descending'):'none'}" style="position:sticky"><div class="th-in" role="button" tabindex="0" data-sort="${c.key}"><span class="lb">${c.label}</span>${sortIcon(c.key)}</div><span class="rz" data-rz="${c.key}" title="Drag to resize"></span></th>`).join('')}</tr>`;
  const all = $('#ckAll'); all.indeterminate = selVis>0 && selVis<vis.length;
  all.onchange = () => { if (all.checked) vis.forEach(r=>S.selected.add(r.id)); else vis.forEach(r=>S.selected.delete(r.id)); renderBody(); };
  $('#thead').querySelectorAll('[data-sort]').forEach(el => {
    const go = () => { const k=el.dataset.sort; S.sort = S.sort.key===k ? {key:k,dir:S.sort.dir==='asc'?'desc':'asc'} : {key:k,dir:'asc'}; renderBody(); const n=$(`[data-sort="${k}"]`); n&&n.focus(); };
    el.onclick = go; el.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
  $('#thead').querySelectorAll('[data-rz]').forEach(h => h.addEventListener('pointerdown', startResize));
}
function cell(r,key){
  if (key==='status'){
    const s = SMAP[r.status];
    return `<div class="wp"><div class="wp-top"><span class="dot" style="background:${s.bar}"></span><span class="st">${s.table}</span><span>${r.pct}%</span></div><div class="wp-bar" style="border-color:${s.bar}"><i style="width:${Math.max(r.pct,1)}%;background:${s.bar}"></i></div></div>`;
  }
  if (key==='priority'){ const p=PRIO[r.priority]; return `<div class="prio"><span style="color:${p.color}">${ic(p.icon)}</span>${r.priority}</div>`; }
  if (key==='mgr'){ const ini=r.mgr.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(); return `<div class="person"><span class="av">${ini}</span><span>${esc(r.mgr)}</span></div>`; }
  return `<span class="cell-txt">${esc(r[key])}</span>`;
}
function rowIcon(r){
  if (r.status==='setup') return `<span class="row-ic pub" title="Setup">${ic('rocket')}</span>`;
  if (r.status==='hold') return `<span class="row-ic hold" title="On hold">${ic('pause')}</span>`;
  return '';
}
function renderBody(){
  const vis = visibleRows();
  const visIds = new Set(vis.map(r=>r.id));
  for (const id of [...S.selected]) if (!visIds.has(id)) S.selected.delete(id);
  renderHeadRow();
  const span = COLS.length + 1 + (HAS_ICON_COL?1:0);
  if (!vis.length){
    $('#tbody').innerHTML = `<tr class="empty"><td colspan="${span}"><p>No workstreams match these filters</p><span>Change or clear your filters to see more work.</span><button class="btn" id="clearAll">Clear filters</button></td></tr>`;
    $('#clearAll').onclick = clearAllFilters;
  } else {
    $('#tbody').innerHTML = vis.map(r => `<tr data-id="${r.id}" class="${S.selected.has(r.id)?'sel':''}">
      <td class="cb"><label class="ck"><input type="checkbox" aria-label="Select ${esc(r.name)}" ${S.selected.has(r.id)?'checked':''}><span class="bx">${ic('checkB','on')}</span></label></td>
      ${HAS_ICON_COL?`<td class="ic">${rowIcon(r)}</td>`:''}
      ${COLS.map(c=>`<td class="c-${c.key}">${cell(r,c.key)}</td>`).join('')}</tr>`).join('');
    $('#tbody').querySelectorAll('tr[data-id]').forEach(tr => {
      const id = +tr.dataset.id, cb = tr.querySelector('input');
      cb.onchange = () => { cb.checked ? S.selected.add(id) : S.selected.delete(id); tr.classList.toggle('sel', cb.checked); renderHeadRow(); updateBulk(); };
      tr.onclick = e => { if (e.target.closest('.ck')) return; if (e.shiftKey||e.metaKey||e.ctrlKey){ cb.checked=!cb.checked; cb.onchange(); } };
    });
  }
  updateBulk();
  if (V==='v3') updateSaveView();
}
function clearAllFilters(){
  S.statuses.clear(); S.search=''; S.filters={priority:new Set(),dept:new Set(),mgr:new Set()};
  if (V==='v3') S.view=null; else S.quick=null;
  renderHead(); renderQuick(); renderStatus(); renderBody();
}

/* ---------------- Column resize ---------------- */
let rz=null;
function startResize(e){
  e.preventDefault(); e.stopPropagation();
  const key = e.currentTarget.dataset.rz, th = e.currentTarget.parentElement;
  const g = $('#guide'), sc = $('#scroll');
  rz = {key, startX:e.clientX, startW:S.widths[key], handle:e.currentTarget, th};
  rz.handle.classList.add('drag'); document.body.classList.add('resizing');
  g.style.display='block'; g.style.height = $('#grid').offsetHeight+'px';
  const place = () => { g.style.left = (th.offsetLeft + th.offsetWidth - 1)+'px'; };
  place(); rz.place = place;
  window.addEventListener('pointermove', onResize); window.addEventListener('pointerup', endResize, {once:true});
}
function onResize(e){
  if (!rz) return;
  S.widths[rz.key] = Math.max(MIN_W, Math.round(rz.startW + e.clientX - rz.startX));
  S.userResized = true; applyWidths(); rz.place();
}
function endResize(){
  window.removeEventListener('pointermove', onResize);
  if (rz) rz.handle.classList.remove('drag');
  document.body.classList.remove('resizing'); $('#guide').style.display='none'; rz=null;
}

/* ---------------- Bulk actions ---------------- */
function updateBulk(){
  const n = S.selected.size;
  $('#bulk').classList.toggle('show', n>0);
  $('#bulkN').textContent = `${n} selected`;
  $('#toast').classList.toggle('low', n===0);
}
$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('[data-bulk]'); if (!b) return;
  const ids = [...S.selected], n = ids.length, label = n===1?'workstream':'workstreams';
  const act = b.dataset.bulk;
  if (act==='clear'){ S.selected.clear(); renderBody(); return; }
  if (act==='edit'){ toast('Bulk edit isn’t part of this prototype'); return; }
  if (act==='publish'){
    S.selected.clear(); renderBody(); toast(`Published ${n} ${label}`);
    return;
  }
  if (act==='complete'){
    const prev = ids.map(id=>{ const r=rows.find(x=>x.id===id); return [r,r.status,r.pct]; });
    prev.forEach(([r])=>{ r.status='complete'; r.pct=100; });
    S.selected.clear(); renderStatus(); renderBody(); updateNavCount();
    toast(`Completed ${n} ${label}`, ()=>{ prev.forEach(([r,s,p])=>{ r.status=s; r.pct=p; }); renderStatus(); renderBody(); updateNavCount(); });
  }
});

/* ---------------- Toast ---------------- */
let toastT;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `${undo?`<span class="ok">${ic('checkCircle')}</span>`:''}<span>${esc(msg)}</span>${undo?'<button id="undoBtn">Undo</button>':''}`;
  t.classList.toggle('low', S.selected.size===0);
  t.classList.add('show'); clearTimeout(toastT);
  if (undo) $('#undoBtn').onclick = () => { undo(); t.classList.remove('show'); };
  toastT = setTimeout(()=>t.classList.remove('show'), 5000);
}

/* ---------------- Popovers ---------------- */
let popAnchor=null;
function openPop(anchor, html, opts={}){
  const p = $('#pop');
  if (popAnchor===anchor && p.classList.contains('show')){ closePop(); return null; }
  closePop();
  p.innerHTML = html; p.className = 'pop show' + (opts.cls?' '+opts.cls:'');
  const r = anchor.getBoundingClientRect();
  p.style.minWidth = (opts.width||Math.max(200, r.width))+'px';
  const pw = p.offsetWidth;
  let left = opts.alignRight ? r.right - pw : r.left;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  p.style.left = left+'px'; p.style.top = (r.bottom+6)+'px';
  popAnchor = anchor; anchor.setAttribute('aria-expanded','true');
  return p;
}
function closePop(){
  $('#pop').classList.remove('show');
  if (popAnchor){ popAnchor.setAttribute('aria-expanded','false'); popAnchor=null; }
}
document.addEventListener('pointerdown', e => { if (popAnchor && !e.target.closest('#pop') && !popAnchor.contains(e.target)) closePop(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && popAnchor){ const a=popAnchor; closePop(); a.focus(); } });
window.addEventListener('resize', ()=>{ closePop(); if(!S.userResized){ initWidths(); applyWidths(); } });

function openWorkspaceMenu(anchor){
  const p = openPop(anchor, `<div role="menu">${WORKSPACES.map((w,i)=>`<button class="mi" role="menuitemradio" aria-checked="${i===S.ws}" data-ws="${i}"><span class="ws-ini">${w.i}</span>${esc(w.n)}${ic('check','tick')}</button>`).join('')}<hr><button class="mi add" data-add="1">${ic('plus')}Add workspace</button></div>`, {width:anchor.offsetWidth});
  if (!p) return;
  p.querySelectorAll('[data-ws]').forEach(b => b.onclick = () => {
    const i=+b.dataset.ws; closePop();
    if (i!==S.ws){ S.ws=i; renderNav(); toast(`Switched to ${WORKSPACES[i].n}`); $('#wsBtn').focus(); }
  });
  p.querySelector('[data-add]').onclick = () => { closePop(); toast('Adding a workspace isn’t part of this prototype'); };
  p.querySelector('.mi').focus();
}

function uniq(k){ return [...new Set(rows.map(r=>r[k]))].sort((a,b)=>k==='priority'?PRIO[a].o-PRIO[b].o:a.localeCompare(b)); }
function openFilters(anchor){
  const grp = (k,t) => `<h4>${t}</h4><div class="fgroup">${uniq(k).map(v=>`<label class="fopt"><span class="ck"><input type="checkbox" data-f="${k}" value="${esc(v)}" ${S.filters[k].has(v)?'checked':''}><span class="bx">${ic('checkB','on')}</span></span>${esc(v)}</label>`).join('')}</div>`;
  const p = openPop(anchor, `<div style="max-height:60vh;overflow:auto">${grp('priority','Priority')}${grp('dept','Department')}${grp('mgr','Work Manager')}</div><div class="pop-foot"><button class="link" id="fClear">Clear all</button><button class="btn" id="fDone" style="height:30px;font-size:13px">Done</button></div>`, {width:240, alignRight:true});
  if (!p) return;
  p.querySelectorAll('[data-f]').forEach(cb => cb.onchange = () => {
    const set = S.filters[cb.dataset.f]; cb.checked ? set.add(cb.value) : set.delete(cb.value);
    updateFilterBadge(); renderStatus(); renderBody();
  });
  p.querySelector('#fClear').onclick = () => { S.filters={priority:new Set(),dept:new Set(),mgr:new Set()}; p.querySelectorAll('[data-f]').forEach(c=>c.checked=false); updateFilterBadge(); renderStatus(); renderBody(); };
  p.querySelector('#fDone').onclick = () => { const a=popAnchor; closePop(); a&&a.focus(); };
}

/* ---------------- Saved views (V3) ---------------- */
const setArr = s => [...s].sort();
const same = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
function baseline(){
  const v = S.views.find(x=>x.id===S.view);
  return v || {statuses:[], filters:{priority:[],dept:[],mgr:[]}};
}
function isDirty(){
  const b = baseline();
  if (!same(setArr(S.statuses), [...b.statuses].sort())) return true;
  return ['priority','dept','mgr'].some(k => !same(setArr(S.filters[k]), [...b.filters[k]].sort()));
}
function updateSaveView(){ const b=$('#saveViewBtn'); if (b) b.hidden = !isDirty(); }
function applyView(id){
  S.view = id; const v = S.views.find(x=>x.id===id);
  S.statuses = new Set(v?v.statuses:[]);
  S.filters = {priority:new Set(v?v.filters.priority:[]), dept:new Set(v?v.filters.dept:[]), mgr:new Set(v?v.filters.mgr:[])};
  closePop(); renderHead(); renderStatus(); renderBody();
}
function openViewMenu(anchor){
  const p = openPop(anchor, `<div role="listbox" style="max-height:60vh;overflow:auto">${S.views.map(v=>`<button class="mi" role="option" aria-checked="${v.id===S.view}" data-v="${v.id}">${ic('bookmark')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.name)}</span>${ic('check','tick')}</button>`).join('')}</div>`, {width:240, alignRight:true});
  if (!p) return;
  p.querySelectorAll('[data-v]').forEach(b => b.onclick = () => applyView(b.dataset.v));
  (p.querySelector('[aria-checked="true"]')||p.querySelector('.mi')).focus();
}
function snapshot(){ return {statuses:setArr(S.statuses), filters:{priority:setArr(S.filters.priority),dept:setArr(S.filters.dept),mgr:setArr(S.filters.mgr)}}; }
function openSaveView(anchor){
  const cur = S.views.find(x=>x.id===S.view);
  const p = openPop(anchor, `<div class="save-pop-in"><h3>Save view</h3><p>Saves the status and filters you’ve applied.</p>
    ${cur?`<button class="btn update-btn" id="svUpdate">Update “${esc(cur.name)}”</button><div class="or">or save as new</div>`:''}
    <input class="field" id="svName" placeholder="View name" maxlength="40" aria-label="View name"><div class="err-msg" id="svErr"></div>
    <div class="row"><button class="btn" id="svCancel">Cancel</button><button class="btn primary" id="svSave">Save view</button></div></div>`, {cls:'save-pop', width:300});
  if (!p) return;
  const name = p.querySelector('#svName'), err = p.querySelector('#svErr');
  const save = () => {
    const n = name.value.trim();
    if (!n){ name.classList.add('err'); err.textContent='Enter a name for this view.'; err.classList.add('show'); name.focus(); return; }
    if (S.views.some(v=>v.name.toLowerCase()===n.toLowerCase())){ name.classList.add('err'); err.textContent='A view with this name already exists.'; err.classList.add('show'); name.focus(); return; }
    const v = {id:'u'+Date.now(), name:n, quick: cur?cur.quick:null, ...snapshot()};
    S.views.push(v); S.view = v.id; closePop(); renderHead(); renderBody(); toast(`Saved view “${n}”`);
  };
  name.oninput = () => { name.classList.remove('err'); err.classList.remove('show'); };
  name.onkeydown = e => { if (e.key==='Enter') save(); };
  p.querySelector('#svSave').onclick = save;
  p.querySelector('#svCancel').onclick = () => { closePop(); anchor.focus(); };
  const up = p.querySelector('#svUpdate');
  if (up) up.onclick = () => { Object.assign(cur, snapshot()); closePop(); renderHead(); renderBody(); toast(`Updated view “${cur.name}”`); };
  name.focus();
}

/* ---------------- Init ---------------- */
renderNav(); renderHead(); renderQuick(); renderStatus();
initWidths(); applyWidths(); renderBody();
</script>
</body>
